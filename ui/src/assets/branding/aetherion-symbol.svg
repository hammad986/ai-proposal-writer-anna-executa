      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="aetherion-right" x1="100" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
